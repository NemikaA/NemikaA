<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 80" width="100%" height="80" role="img" aria-label="Special attacks">
  <defs>
    <filter id="heartglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pixel { font-family: 'Courier New', 'Lucida Console', monospace; }
    .yellow { fill:#FFD700; font-weight:bold; }
    .val { fill:#FFD700; }
    .dim { fill:#ffffff; opacity:.6; }
    .menu-text { font-family:'Courier New','Lucida Console',monospace; font-size:15px; font-weight:bold; fill:#fff; }
    .blink-cursor { animation: blink 1.1s step-end infinite; fill:#FFD700; }
    .heart-pulse { transform-box: fill-box; transform-origin: center; animation: heartbeat 1.4s ease-in-out infinite; }
    .bob { animation: bob 1.2s steps(1) infinite; }
    .hp-bar-anim { animation: hpglow 2.5s ease-in-out infinite alternate; }
    .tw { animation: twinkle 2.4s ease-in-out infinite alternate; }
    .row { animation: fadein .6s ease-out both; }
    @keyframes blink { 0%,100% {opacity:1;} 50% {opacity:0;} }
    @keyframes heartbeat { 0%,100% {transform:scale(1);} 30% {transform:scale(1.18);} 60% {transform:scale(.92);} }
    @keyframes bob { 0%,100% {transform:translateY(0);} 50% {transform:translateY(-3px);} }
    @keyframes hpglow { 0% {opacity:.85;} 100% {opacity:1;} }
    @keyframes twinkle { 0% {opacity:.15;} 100% {opacity:1;} }
    @keyframes fadein { from {opacity:0;} to {opacity:1;} }
  </style>
  <rect width="850" height="80" fill="#000000"/>
  <rect x="6" y="6" width="838" height="68" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="12" y="12" width="826" height="56" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="6" y="6" width="8" height="8" fill="#000000"/><rect x="836" y="6" width="8" height="8" fill="#000000"/>
  <rect x="6" y="66" width="8" height="8" fill="#000000"/><rect x="836" y="66" width="8" height="8" fill="#000000"/>
  <text x="732" y="27" class="pixel tw" font-size="9" fill="#FFD700" style="animation-delay:1.0s">✦</text>
  <rect x="758" y="28" width="2" height="2" fill="#42FCFF" class="tw" style="animation-delay:3.0s"/>
  <text x="780" y="35" class="pixel tw" font-size="7" fill="#ffffff" style="animation-delay:2.4s">✦</text>
  <rect x="804" y="38" width="2" height="2" fill="#ffffff" class="tw" style="animation-delay:2.8s"/>
  <g transform="translate(42,27)"><g class="bob"><rect x="9" y="0" width="3" height="3" fill="#ffffff"/><rect x="9" y="3" width="3" height="3" fill="#ffffff"/><rect x="9" y="6" width="3" height="3" fill="#ffffff"/><rect x="9" y="9" width="3" height="3" fill="#ffffff"/><rect x="9" y="12" width="3" height="3" fill="#ffffff"/><rect x="9" y="15" width="3" height="3" fill="#ffffff"/><rect x="3" y="18" width="3" height="3" fill="#FF9D00"/><rect x="6" y="18" width="3" height="3" fill="#FF9D00"/><rect x="9" y="18" width="3" height="3" fill="#FF9D00"/><rect x="12" y="18" width="3" height="3" fill="#FF9D00"/><rect x="15" y="18" width="3" height="3" fill="#FF9D00"/><rect x="9" y="21" width="3" height="3" fill="#a05a00"/><rect x="9" y="24" width="3" height="3" fill="#a05a00"/><rect x="6" y="27" width="3" height="3" fill="#FF9D00"/><rect x="9" y="27" width="3" height="3" fill="#FF9D00"/><rect x="12" y="27" width="3" height="3" fill="#FF9D00"/></g></g><text x="88" y="50" class="pixel blink-cursor" font-size="17">▶</text>
  <text x="110" y="50" class="pixel yellow" font-size="17" letter-spacing="1">* SPECIAL ATTACKS</text>
  
</svg>
