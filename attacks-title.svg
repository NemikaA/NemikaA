<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 84" width="100%" height="84" role="img" aria-label="Special attacks">
  <defs>
    <filter id="heartglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pixel { font-family: 'Courier New', 'Lucida Console', monospace; }
    .yellow { fill:#FFD700; font-weight:bold; }
    .val { fill:#FFD700; }
    .dim { fill:#ffffff; opacity:.6; }
    .menu-text { font-family:'Courier New','Lucida Console',monospace; font-size:15px; font-weight:bold; fill:#fff; }
    .blink-cursor { animation: blink 1.1s step-end infinite; fill:#FFD700; }
    .heart-pulse { transform-box: fill-box; transform-origin: center; animation: heartbeat 1.4s ease-in-out infinite; }
    .bob { animation: bob 1.2s steps(1) infinite; }
    .hp-bar-anim { animation: hpglow 2.5s ease-in-out infinite alternate; }
    .tw { animation: twinkle 2.4s ease-in-out infinite alternate; }
    .row { animation: fadein .6s ease-out both; }
    @keyframes blink { 0%,100% {opacity:1;} 50% {opacity:0;} }
    @keyframes heartbeat { 0%,100% {transform:scale(1);} 30% {transform:scale(1.18);} 60% {transform:scale(.92);} }
    @keyframes bob { 0%,100% {transform:translateY(0);} 50% {transform:translateY(-3px);} }
    @keyframes hpglow { 0% {opacity:.85;} 100% {opacity:1;} }
    @keyframes twinkle { 0% {opacity:.15;} 100% {opacity:1;} }
    @keyframes fadein { from {opacity:0;} to {opacity:1;} }
  </style>
  <rect width="850" height="84" fill="#000000"/>
  <rect x="6" y="6" width="838" height="72" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="12" y="12" width="826" height="60" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="6" y="6" width="8" height="8" fill="#000000"/><rect x="836" y="6" width="8" height="8" fill="#000000"/>
  <rect x="6" y="70" width="8" height="8" fill="#000000"/><rect x="836" y="70" width="8" height="8" fill="#000000"/>
  <text x="487" y="24" class="pixel tw" font-size="9" fill="#FFD700" style="animation-delay:3.0s">✦</text>
  <rect x="696" y="33" width="2" height="2" fill="#FFD700" class="tw" style="animation-delay:2.8s"/>
  <text x="510" y="29" class="pixel tw" font-size="9" fill="#ffffff" style="animation-delay:2.6s">✦</text>
  <text x="770" y="31" class="pixel tw" font-size="8" fill="#42FCFF" style="animation-delay:2.6s">✦</text>
  <text x="646" y="25" class="pixel tw" font-size="8" fill="#FFD700" style="animation-delay:2.1s">✦</text>
  <rect x="468" y="31" width="2" height="2" fill="#FFD700" class="tw" style="animation-delay:1.0s"/>
  <rect x="824" y="42" width="2" height="2" fill="#FFD700" class="tw" style="animation-delay:1.5s"/>
  <rect x="825" y="46" width="2" height="2" fill="#ffffff" class="tw" style="animation-delay:2.2s"/>
  <g transform="translate(38,24)"><g class="bob"><rect x="12" y="0" width="4" height="4" fill="#ffffff"/><rect x="12" y="4" width="4" height="4" fill="#ffffff"/><rect x="12" y="8" width="4" height="4" fill="#ffffff"/><rect x="12" y="12" width="4" height="4" fill="#ffffff"/><rect x="12" y="16" width="4" height="4" fill="#ffffff"/><rect x="12" y="20" width="4" height="4" fill="#ffffff"/><rect x="4" y="24" width="4" height="4" fill="#FF9D00"/><rect x="8" y="24" width="4" height="4" fill="#FF9D00"/><rect x="12" y="24" width="4" height="4" fill="#FF9D00"/><rect x="16" y="24" width="4" height="4" fill="#FF9D00"/><rect x="20" y="24" width="4" height="4" fill="#FF9D00"/><rect x="12" y="28" width="4" height="4" fill="#a05a00"/><rect x="12" y="32" width="4" height="4" fill="#a05a00"/><rect x="8" y="36" width="4" height="4" fill="#FF9D00"/><rect x="12" y="36" width="4" height="4" fill="#FF9D00"/><rect x="16" y="36" width="4" height="4" fill="#FF9D00"/></g></g><text x="88" y="56" class="pixel blink-cursor" font-size="17">▶</text>
  <text x="110" y="56" class="pixel yellow" font-size="17" letter-spacing="1">* SPECIAL ATTACKS</text>
  <text x="820" y="60" class="pixel" font-size="11" fill="#FFD700" opacity="0.7" text-anchor="end" letter-spacing="2">ACT</text>
  
</svg>
