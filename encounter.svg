<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 262" width="100%" height="262" role="img" aria-label="Encounter: focus and active quests">
  <defs>
    <filter id="heartglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pixel { font-family: 'Courier New', 'Lucida Console', monospace; }
    .yellow { fill:#FFD700; font-weight:bold; }
    .val { fill:#FFD700; }
    .dim { fill:#ffffff; opacity:.6; }
    .menu-text { font-family:'Courier New','Lucida Console',monospace; font-size:15px; font-weight:bold; fill:#fff; }
    .blink-cursor { animation: blink 1.1s step-end infinite; fill:#FFD700; }
    .heart-pulse { transform-box: fill-box; transform-origin: center; animation: heartbeat 1.4s ease-in-out infinite; }
    .bob { animation: bob 1.2s steps(1) infinite; }
    .hp-bar-anim { animation: hpglow 2.5s ease-in-out infinite alternate; }
    .tw { animation: twinkle 2.4s ease-in-out infinite alternate; }
    .row { animation: fadein .6s ease-out both; }
    @keyframes blink { 0%,100% {opacity:1;} 50% {opacity:0;} }
    @keyframes heartbeat { 0%,100% {transform:scale(1);} 30% {transform:scale(1.18);} 60% {transform:scale(.92);} }
    @keyframes bob { 0%,100% {transform:translateY(0);} 50% {transform:translateY(-3px);} }
    @keyframes hpglow { 0% {opacity:.85;} 100% {opacity:1;} }
    @keyframes twinkle { 0% {opacity:.15;} 100% {opacity:1;} }
    @keyframes fadein { from {opacity:0;} to {opacity:1;} }
  </style>
  <rect width="850" height="262" fill="#000000"/>
  <rect x="6" y="6" width="838" height="250" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="12" y="12" width="826" height="238" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="6" y="6" width="8" height="8" fill="#000000"/><rect x="836" y="6" width="8" height="8" fill="#000000"/>
  <rect x="6" y="248" width="8" height="8" fill="#000000"/><rect x="836" y="248" width="8" height="8" fill="#000000"/>
  <rect x="634" y="25" width="2" height="2" fill="#ffffff" class="tw" style="animation-delay:2.4s"/>
  <text x="467" y="26" class="pixel tw" font-size="8" fill="#FF9D00" style="animation-delay:1.0s">✦</text>
  <text x="492" y="31" class="pixel tw" font-size="7" fill="#FF9D00" style="animation-delay:0.9s">✦</text>
  <text x="594" y="21" class="pixel tw" font-size="9" fill="#FFD700" style="animation-delay:1.9s">✦</text>
  <rect x="631" y="23" width="2" height="2" fill="#FF9D00" class="tw" style="animation-delay:1.9s"/>
  <rect x="385" y="33" width="2" height="2" fill="#ffffff" class="tw" style="animation-delay:0.2s"/>
  <rect x="827" y="102" width="2" height="2" fill="#42FCFF" class="tw" style="animation-delay:0.3s"/>
  <rect x="830" y="107" width="2" height="2" fill="#FFD700" class="tw" style="animation-delay:2.7s"/>
  <rect x="465" y="231" width="2" height="2" fill="#ffffff" class="tw" style="animation-delay:2.1s"/>
  <text x="188" y="230" class="pixel tw" font-size="9" fill="#FF9D00" style="animation-delay:1.5s">✦</text>
  <text x="343" y="233" class="pixel tw" font-size="7" fill="#ffffff" style="animation-delay:1.1s">✦</text>
  <rect x="442" y="229" width="2" height="2" fill="#ffffff" class="tw" style="animation-delay:2.6s"/>
  <text x="367" y="238" class="pixel tw" font-size="9" fill="#FFD700" style="animation-delay:0.1s">✦</text>
  <g transform="translate(42,124)"><g class="bob"><rect x="4" y="0" width="4" height="4" fill="#FFD700"/><rect x="8" y="0" width="4" height="4" fill="#FFD700"/><rect x="12" y="0" width="4" height="4" fill="#FFD700"/><rect x="4" y="4" width="4" height="4" fill="#FFD700"/><rect x="8" y="4" width="4" height="4" fill="#FFD700"/><rect x="12" y="4" width="4" height="4" fill="#FFD700"/><rect x="4" y="8" width="4" height="4" fill="#FFD700"/><rect x="8" y="8" width="4" height="4" fill="#FFD700"/><rect x="12" y="8" width="4" height="4" fill="#FFD700"/><rect x="4" y="12" width="4" height="4" fill="#FFD700"/><rect x="8" y="12" width="4" height="4" fill="#FFD700"/><rect x="12" y="12" width="4" height="4" fill="#FFD700"/><rect x="4" y="16" width="4" height="4" fill="#FFD700"/><rect x="8" y="16" width="4" height="4" fill="#FFD700"/><rect x="12" y="16" width="4" height="4" fill="#FFD700"/><rect x="4" y="24" width="4" height="4" fill="#FFD700"/><rect x="8" y="24" width="4" height="4" fill="#FFD700"/><rect x="12" y="24" width="4" height="4" fill="#FFD700"/><rect x="4" y="28" width="4" height="4" fill="#FFD700"/><rect x="8" y="28" width="4" height="4" fill="#FFD700"/><rect x="12" y="28" width="4" height="4" fill="#FFD700"/></g></g><text x="88" y="52" class="pixel blink-cursor" font-size="17">▶</text>
  <text x="110" y="52" class="pixel yellow" font-size="17" letter-spacing="1">* ENCOUNTER</text>
  <line x1="30" y1="66" x2="820" y2="66" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <text x="88" y="92" class="pixel row" font-size="14" font-weight="bold" fill="#FFD700" style="animation-delay:0.2s">[FOCUS]</text>
  <text x="222" y="92" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.2s">Machine Learning · Deep Learning · Data Science</text>
  <text x="88" y="124" class="pixel row" font-size="14" font-weight="bold" fill="#FF9D00" style="animation-delay:0.5s">[ACTIVE QUEST]</text>
  <text x="222" y="124" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.5s">sinhala-akuru-ai — generative AI pipeline that renders</text>
  <text x="222" y="144" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.5s">Sinhala typography onto images using diffusion models,</text>
  <text x="222" y="164" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.5s">region-weighted loss &amp; ControlNet</text>
  <text x="88" y="190" class="pixel row" font-size="14" font-weight="bold" fill="#42FCFF" style="animation-delay:0.8s">[STAT GRIND]</text>
  <text x="222" y="190" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.8s">EDA · Hypothesis Testing · Predictive Modeling — R, Python, SQL</text>
  <text x="88" y="222" class="pixel row" font-size="14" font-weight="bold" fill="#1FD75B" style="animation-delay:1.1s">[SIDE QUEST]</text>
  <text x="222" y="222" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:1.1s">BotWars2026 — strategic AI &amp; game theory bots</text>
  <text x="820" y="238" class="pixel" font-size="11" fill="#FFD700" opacity="0.7" text-anchor="end" letter-spacing="2">QUESTS</text>
  
</svg>
