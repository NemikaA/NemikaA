<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="280" role="img" aria-label="Encounter: focus and active quests">
  <defs>
    <filter id="heartglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pixel { font-family: 'Courier New', 'Lucida Console', monospace; }
    .yellow { fill:#FFD700; font-weight:bold; }
    .val { fill:#FFD700; }
    .dim { fill:#ffffff; opacity:.6; }
    .menu-text { font-family:'Courier New','Lucida Console',monospace; font-size:15px; font-weight:bold; fill:#fff; }
    .blink-cursor { animation: blink 1.1s step-end infinite; fill:#FFD700; }
    .heart-pulse { transform-box: fill-box; transform-origin: center; animation: heartbeat 1.4s ease-in-out infinite; }
    .bob { animation: bob 1.2s steps(1) infinite; }
    .hp-bar-anim { animation: hpglow 2.5s ease-in-out infinite alternate; }
    .tw { animation: twinkle 2.4s ease-in-out infinite alternate; }
    .row { animation: fadein .6s ease-out both; }
    @keyframes blink { 0%,100% {opacity:1;} 50% {opacity:0;} }
    @keyframes heartbeat { 0%,100% {transform:scale(1);} 30% {transform:scale(1.18);} 60% {transform:scale(.92);} }
    @keyframes bob { 0%,100% {transform:translateY(0);} 50% {transform:translateY(-3px);} }
    @keyframes hpglow { 0% {opacity:.85;} 100% {opacity:1;} }
    @keyframes twinkle { 0% {opacity:.15;} 100% {opacity:1;} }
    @keyframes fadein { from {opacity:0;} to {opacity:1;} }
  </style>
  <rect width="850" height="280" fill="#000000"/>
  <rect x="6" y="6" width="838" height="268" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="12" y="12" width="826" height="256" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="6" y="6" width="8" height="8" fill="#000000"/><rect x="836" y="6" width="8" height="8" fill="#000000"/>
  <rect x="6" y="266" width="8" height="8" fill="#000000"/><rect x="836" y="266" width="8" height="8" fill="#000000"/>
  <text x="732" y="30" class="pixel tw" font-size="9" fill="#FFD700" style="animation-delay:2.5s">✦</text>
  <rect x="758" y="28" width="2" height="2" fill="#42FCFF" class="tw" style="animation-delay:0.1s"/>
  <text x="780" y="35" class="pixel tw" font-size="7" fill="#ffffff" style="animation-delay:2.3s">✦</text>
  <rect x="804" y="25" width="2" height="2" fill="#ffffff" class="tw" style="animation-delay:0.8s"/>
  <g transform="translate(44,34)"><g class="bob"><rect x="3" y="0" width="3" height="3" fill="#FFD700"/><rect x="6" y="0" width="3" height="3" fill="#FFD700"/><rect x="9" y="0" width="3" height="3" fill="#FFD700"/><rect x="3" y="3" width="3" height="3" fill="#FFD700"/><rect x="6" y="3" width="3" height="3" fill="#FFD700"/><rect x="9" y="3" width="3" height="3" fill="#FFD700"/><rect x="3" y="6" width="3" height="3" fill="#FFD700"/><rect x="6" y="6" width="3" height="3" fill="#FFD700"/><rect x="9" y="6" width="3" height="3" fill="#FFD700"/><rect x="3" y="9" width="3" height="3" fill="#FFD700"/><rect x="6" y="9" width="3" height="3" fill="#FFD700"/><rect x="9" y="9" width="3" height="3" fill="#FFD700"/><rect x="3" y="12" width="3" height="3" fill="#FFD700"/><rect x="6" y="12" width="3" height="3" fill="#FFD700"/><rect x="9" y="12" width="3" height="3" fill="#FFD700"/><rect x="3" y="18" width="3" height="3" fill="#FFD700"/><rect x="6" y="18" width="3" height="3" fill="#FFD700"/><rect x="9" y="18" width="3" height="3" fill="#FFD700"/><rect x="3" y="21" width="3" height="3" fill="#FFD700"/><rect x="6" y="21" width="3" height="3" fill="#FFD700"/><rect x="9" y="21" width="3" height="3" fill="#FFD700"/></g></g><text x="88" y="52" class="pixel blink-cursor" font-size="17">▶</text>
  <text x="110" y="52" class="pixel yellow" font-size="17" letter-spacing="1">* ENCOUNTER</text>
  <line x1="30" y1="66" x2="820" y2="66" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <text x="88" y="98" class="pixel row" font-size="14" font-weight="bold" fill="#FFD700" style="animation-delay:0.2s">[FOCUS]</text>
  <text x="222" y="98" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.2s">Machine Learning · Deep Learning · Data Science</text>
  <text x="88" y="132" class="pixel row" font-size="14" font-weight="bold" fill="#FF9D00" style="animation-delay:0.5s">[ACTIVE QUEST]</text>
  <text x="222" y="132" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.5s">sinhala-akuru-ai — generative AI pipeline that renders</text>
  <text x="222" y="152" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.5s">Sinhala typography onto images using diffusion models,</text>
  <text x="222" y="172" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.5s">region-weighted loss &amp; ControlNet</text>
  <text x="88" y="206" class="pixel row" font-size="14" font-weight="bold" fill="#FFD700" style="animation-delay:0.8s">[STAT GRIND]</text>
  <text x="222" y="206" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.8s">EDA · Hypothesis Testing · Predictive Modeling — R, Python, SQL</text>
  <text x="88" y="240" class="pixel row" font-size="14" font-weight="bold" fill="#FFD700" style="animation-delay:1.1s">[SIDE QUEST]</text>
  <text x="222" y="240" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:1.1s">BotWars2026 — strategic AI &amp; game theory bots</text>
  
</svg>
