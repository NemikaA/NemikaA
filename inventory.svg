<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 372" width="100%" height="372" role="img" aria-label="Inventory: stats and tech stack">
  <defs>
    <filter id="heartglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pixel { font-family: 'Courier New', 'Lucida Console', monospace; }
    .yellow { fill:#FFD700; font-weight:bold; }
    .val { fill:#FFD700; }
    .dim { fill:#ffffff; opacity:.6; }
    .menu-text { font-family:'Courier New','Lucida Console',monospace; font-size:15px; font-weight:bold; fill:#fff; }
    .blink-cursor { animation: blink 1.1s step-end infinite; fill:#FFD700; }
    .heart-pulse { transform-box: fill-box; transform-origin: center; animation: heartbeat 1.4s ease-in-out infinite; }
    .hp-bar-anim { animation: hpglow 2.5s ease-in-out infinite alternate; }
    .stars { animation: twinkle 2s ease-in-out infinite alternate; }
    .stars2 { animation: twinkle 3s ease-in-out infinite alternate; }
    .row { animation: fadein .6s ease-out both; }
    @keyframes blink { 0%,100% {opacity:1;} 50% {opacity:0;} }
    @keyframes heartbeat { 0%,100% {transform:scale(1);} 30% {transform:scale(1.18);} 60% {transform:scale(.92);} }
    @keyframes hpglow { 0% {opacity:.85;} 100% {opacity:1;} }
    @keyframes twinkle { 0% {opacity:.3;} 100% {opacity:1;} }
    @keyframes fadein { from {opacity:0;} to {opacity:1;} }
  </style>
  <rect width="850" height="372" fill="#000000"/>
  <rect x="6" y="6" width="838" height="360" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="12" y="12" width="826" height="348" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="6" y="6" width="8" height="8" fill="#000000"/><rect x="836" y="6" width="8" height="8" fill="#000000"/>
  <rect x="6" y="358" width="8" height="8" fill="#000000"/><rect x="836" y="358" width="8" height="8" fill="#000000"/>
  <text x="30" y="40" class="pixel stars" font-size="10" fill="#ffffff" opacity="0.6">✦</text>
  <text x="806" y="40" class="pixel stars2" font-size="8" fill="#ffffff" opacity="0.5">✦</text>
  <g transform="translate(52,190)"><g class="heart-pulse" filter="url(#heartglow)"><text font-family="'Courier New', monospace" font-size="30" fill="#FF0000" text-anchor="middle">♥</text></g></g><text x="88" y="52" class="pixel blink-cursor" font-size="17">▶</text>
  <text x="110" y="52" class="pixel yellow" font-size="17" letter-spacing="1">* INVENTORY</text>
  <line x1="30" y1="66" x2="820" y2="66" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="408" y1="80" x2="408" y2="338" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <text x="88" y="96" class="pixel yellow row" font-size="14"  style="animation-delay:0.2s" >NAME</text>
  <text x="190" y="96" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.2s" >Nemika Aluthgedara</text>
  <text x="88" y="130" class="pixel yellow row" font-size="14"  style="animation-delay:0.3s" >LV</text>
  <text x="190" y="130" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.3s" >20</text>
  <text x="88" y="164" class="pixel yellow row" font-size="14"  style="animation-delay:0.5s" >HP</text>
  <g class="row" style="animation-delay:0.5s"><rect x="190" y="152" width="140" height="14" fill="#000000" stroke="#ffffff" stroke-width="1.5"/><rect x="191" y="153" width="130" height="12" fill="#FFD700" rx="1" class="hp-bar-anim"/></g>
  <text x="342" y="164" class="pixel yellow row" font-size="13"  style="animation-delay:0.5s" >92 / 100</text>
  <text x="88" y="198" class="pixel yellow row" font-size="14"  style="animation-delay:0.7s" >EXP</text>
  <text x="190" y="198" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.7s" >∞</text>
  <text x="88" y="232" class="pixel yellow row" font-size="14"  style="animation-delay:0.8s" >AT / DF</text>
  <text x="190" y="232" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.8s" >99 / 99</text>
  <text x="88" y="266" class="pixel yellow row" font-size="14"  style="animation-delay:1.0s" >WEAPON</text>
  <text x="190" y="266" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:1.0s" >Python + PyTorch</text>
  <text x="88" y="300" class="pixel yellow row" font-size="14"  style="animation-delay:1.1s" >ARMOR</text>
  <text x="190" y="300" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:1.1s" >Scikit-Learn Shield</text>
  <text x="436" y="96" class="pixel yellow row" font-size="14"  style="animation-delay:0.3s" >* ML &amp; DEEP LEARNING</text>
  <text x="458" y="118" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.3s" >PyTorch · TensorFlow · Scikit-Learn</text>
  <text x="458" y="140" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.3s" >Hugging Face · OpenCV · FastAPI</text>
  <text x="436" y="180" class="pixel yellow row" font-size="14"  style="animation-delay:0.6s" >* DATA SCIENCE</text>
  <text x="458" y="202" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.6s" >R · pandas · numpy · Jupyter · SQL</text>
  <text x="436" y="242" class="pixel yellow row" font-size="14"  style="animation-delay:0.9s" >* LANGUAGES</text>
  <text x="458" y="264" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.9s" >Python · Java · R · HTML5 · CSS3 · SQL</text>
  <text x="436" y="304" class="pixel yellow row" font-size="14"  style="animation-delay:1.2s" >* TOOLS</text>
  <text x="458" y="326" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:1.2s" >Git · GitHub · VS Code</text>
  <text x="820" y="348" class="pixel" font-size="11" fill="#FFD700" opacity="0.7" text-anchor="end" letter-spacing="2">ITEMS</text>
  
</svg>
