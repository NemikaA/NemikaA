<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 364" width="100%" height="364" role="img" aria-label="Inventory: stats and tech stack">
  <defs>
    <filter id="heartglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pixel { font-family: 'Courier New', 'Lucida Console', monospace; }
    .yellow { fill:#FFD700; font-weight:bold; }
    .val { fill:#FFD700; }
    .dim { fill:#ffffff; opacity:.6; }
    .menu-text { font-family:'Courier New','Lucida Console',monospace; font-size:15px; font-weight:bold; fill:#fff; }
    .blink-cursor { animation: blink 1.1s step-end infinite; fill:#FFD700; }
    .heart-pulse { transform-box: fill-box; transform-origin: center; animation: heartbeat 1.4s ease-in-out infinite; }
    .bob { animation: bob 1.2s steps(1) infinite; }
    .hp-bar-anim { animation: hpglow 2.5s ease-in-out infinite alternate; }
    .tw { animation: twinkle 2.4s ease-in-out infinite alternate; }
    .row { animation: fadein .6s ease-out both; }
    @keyframes blink { 0%,100% {opacity:1;} 50% {opacity:0;} }
    @keyframes heartbeat { 0%,100% {transform:scale(1);} 30% {transform:scale(1.18);} 60% {transform:scale(.92);} }
    @keyframes bob { 0%,100% {transform:translateY(0);} 50% {transform:translateY(-3px);} }
    @keyframes hpglow { 0% {opacity:.85;} 100% {opacity:1;} }
    @keyframes twinkle { 0% {opacity:.15;} 100% {opacity:1;} }
    @keyframes fadein { from {opacity:0;} to {opacity:1;} }
  </style>
  <rect width="850" height="364" fill="#000000"/>
  <rect x="6" y="6" width="838" height="352" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="12" y="12" width="826" height="340" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="6" y="6" width="8" height="8" fill="#000000"/><rect x="836" y="6" width="8" height="8" fill="#000000"/>
