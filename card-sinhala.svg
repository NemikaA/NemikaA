<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 132" width="100%" height="132" role="img" aria-label="sinhala-akuru-ai: Computer Vision &amp; Generative AI">
  <defs>
    <filter id="heartglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pixel { font-family: 'Courier New', 'Lucida Console', monospace; }
    .yellow { fill:#FFD700; font-weight:bold; }
    .val { fill:#FFD700; }
    .dim { fill:#ffffff; opacity:.6; }
    .menu-text { font-family:'Courier New','Lucida Console',monospace; font-size:15px; font-weight:bold; fill:#fff; }
    .blink-cursor { animation: blink 1.1s step-end infinite; fill:#FFD700; }
    .heart-pulse { transform-box: fill-box; transform-origin: center; animation: heartbeat 1.4s ease-in-out infinite; }
    .bob { animation: bob 1.2s steps(1) infinite; }
    .hp-bar-anim { animation: hpglow 2.5s ease-in-out infinite alternate; }
    .tw { animation: twinkle 2.4s ease-in-out infinite alternate; }
    .row { animation: fadein .6s ease-out both; }
    @keyframes blink { 0%,100% {opacity:1;} 50% {opacity:0;} }
    @keyframes heartbeat { 0%,100% {transform:scale(1);} 30% {transform:scale(1.18);} 60% {transform:scale(.92);} }
    @keyframes bob { 0%,100% {transform:translateY(0);} 50% {transform:translateY(-3px);} }
    @keyframes hpglow { 0% {opacity:.85;} 100% {opacity:1;} }
    @keyframes twinkle { 0% {opacity:.15;} 100% {opacity:1;} }
    @keyframes fadein { from {opacity:0;} to {opacity:1;} }
  </style>
  <rect width="850" height="132" fill="#000000"/>
  <rect x="6" y="6" width="838" height="120" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="12" y="12" width="826" height="108" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="6" y="6" width="8" height="8" fill="#000000"/><rect x="836" y="6" width="8" height="8" fill="#000000"/>
  <rect x="6" y="118" width="8" height="8" fill="#000000"/><rect x="836" y="118" width="8" height="8" fill="#000000"/>
  <text x="732" y="26" class="pixel tw" font-size="9" fill="#FFD700" style="animation-delay:1.3s">✦</text>
  <rect x="758" y="31" width="2" height="2" fill="#42FCFF" class="tw" style="animation-delay:1.1s"/>
  <text x="780" y="30" class="pixel tw" font-size="7" fill="#ffffff" style="animation-delay:2.8s">✦</text>
  <rect x="804" y="28" width="2" height="2" fill="#ffffff" class="tw" style="animation-delay:1.2s"/>
  <g transform="translate(38,38)"><g class="bob"><rect x="6" y="0" width="3" height="3" fill="#ffffff"/><rect x="9" y="0" width="3" height="3" fill="#ffffff"/><rect x="12" y="0" width="3" height="3" fill="#ffffff"/><rect x="15" y="0" width="3" height="3" fill="#ffffff"/><rect x="18" y="0" width="3" height="3" fill="#ffffff"/><rect x="3" y="3" width="3" height="3" fill="#ffffff"/><rect x="21" y="3" width="3" height="3" fill="#ffffff"/><rect x="0" y="6" width="3" height="3" fill="#ffffff"/><rect x="9" y="6" width="3" height="3" fill="#42FCFF"/><rect x="12" y="6" width="3" height="3" fill="#42FCFF"/><rect x="15" y="6" width="3" height="3" fill="#42FCFF"/><rect x="24" y="6" width="3" height="3" fill="#ffffff"/><rect x="3" y="9" width="3" height="3" fill="#ffffff"/><rect x="21" y="9" width="3" height="3" fill="#ffffff"/><rect x="6" y="12" width="3" height="3" fill="#ffffff"/><rect x="9" y="12" width="3" height="3" fill="#ffffff"/><rect x="12" y="12" width="3" height="3" fill="#ffffff"/><rect x="15" y="12" width="3" height="3" fill="#ffffff"/><rect x="18" y="12" width="3" height="3" fill="#ffffff"/></g></g><text x="88" y="50" class="pixel yellow" font-size="17" letter-spacing="1">sinhala-akuru-ai</text>
  <text x="283" y="50" class="pixel dim" font-size="13">[Computer Vision &amp; Generative AI]</text>
  <line x1="30" y1="62" x2="820" y2="62" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <text x="88" y="84" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.0s">Diffusion inpainting pipeline — renders Sinhala glyphs onto images.</text>
  <text x="88" y="106" class="pixel dim row" font-size="12" fill="#ffffff" style="animation-delay:0.0s">[PyTorch]  [Diffusers]  [ControlNet]  [FastAPI]</text>
  <rect x="690" y="78" width="120" height="34" fill="#000000" stroke="#FF9D00" stroke-width="2.5"/>
  <text x="750" y="100" class="menu-text" text-anchor="middle" fill="#FF9D00">CHECK ▶</text>
  
</svg>
