<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 116" width="100%" height="116" role="img" aria-label="Nemika used determination">
  <defs>
    <filter id="heartglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pixel { font-family: 'Courier New', 'Lucida Console', monospace; }
    .yellow { fill:#FFD700; font-weight:bold; }
    .val { fill:#FFD700; }
    .dim { fill:#ffffff; opacity:.6; }
    .menu-text { font-family:'Courier New','Lucida Console',monospace; font-size:15px; font-weight:bold; fill:#fff; }
    .blink-cursor { animation: blink 1.1s step-end infinite; fill:#FFD700; }
    .heart-pulse { transform-box: fill-box; transform-origin: center; animation: heartbeat 1.4s ease-in-out infinite; }
    .bob { animation: bob 1.2s steps(1) infinite; }
    .hp-bar-anim { animation: hpglow 2.5s ease-in-out infinite alternate; }
    .tw { animation: twinkle 2.4s ease-in-out infinite alternate; }
    .row { animation: fadein .6s ease-out both; }
    @keyframes blink { 0%,100% {opacity:1;} 50% {opacity:0;} }
    @keyframes heartbeat { 0%,100% {transform:scale(1);} 30% {transform:scale(1.18);} 60% {transform:scale(.92);} }
    @keyframes bob { 0%,100% {transform:translateY(0);} 50% {transform:translateY(-3px);} }
    @keyframes hpglow { 0% {opacity:.85;} 100% {opacity:1;} }
    @keyframes twinkle { 0% {opacity:.15;} 100% {opacity:1;} }
    @keyframes fadein { from {opacity:0;} to {opacity:1;} }
  </style>
  <rect width="850" height="116" fill="#000000"/>
  <rect x="6" y="6" width="838" height="104" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="12" y="12" width="826" height="92" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="6" y="6" width="8" height="8" fill="#000000"/><rect x="836" y="6" width="8" height="8" fill="#000000"/>
  <rect x="6" y="102" width="8" height="8" fill="#000000"/><rect x="836" y="102" width="8" height="8" fill="#000000"/>
  <text x="688" y="26" class="pixel tw" font-size="9" fill="#ffffff" style="animation-delay:2.7s">✦</text>
  <text x="466" y="25" class="pixel tw" font-size="9" fill="#ffffff" style="animation-delay:1.2s">✦</text>
  <text x="762" y="22" class="pixel tw" font-size="10" fill="#FFD700" style="animation-delay:1.4s">✦</text>
  <text x="507" y="31" class="pixel tw" font-size="7" fill="#42FCFF" style="animation-delay:1.3s">✦</text>
  <rect x="575" y="33" width="2" height="2" fill="#42FCFF" class="tw" style="animation-delay:1.9s"/>
  <text x="421" y="32" class="pixel tw" font-size="10" fill="#FF9D00" style="animation-delay:0.4s">✦</text>
  <text x="827" y="55" class="pixel tw" font-size="7" fill="#ffffff" style="animation-delay:1.0s">✦</text>
  <text x="829" y="60" class="pixel tw" font-size="7" fill="#42FCFF" style="animation-delay:2.5s">✦</text>
  <g transform="translate(34,62)"><g class="bob"><rect x="16" y="0" width="4" height="4" fill="#FFD700"/><rect x="16" y="4" width="4" height="4" fill="#FFD700"/><rect x="12" y="8" width="4" height="4" fill="#FFD700"/><rect x="16" y="8" width="4" height="4" fill="#FFD700"/><rect x="20" y="8" width="4" height="4" fill="#FFD700"/><rect x="8" y="12" width="4" height="4" fill="#FFD700"/><rect x="12" y="12" width="4" height="4" fill="#FFD700"/><rect x="16" y="12" width="4" height="4" fill="#FFD700"/><rect x="20" y="12" width="4" height="4" fill="#FFD700"/><rect x="24" y="12" width="4" height="4" fill="#FFD700"/><rect x="0" y="16" width="4" height="4" fill="#FFD700"/><rect x="4" y="16" width="4" height="4" fill="#FFD700"/><rect x="8" y="16" width="4" height="4" fill="#FFD700"/><rect x="12" y="16" width="4" height="4" fill="#FFD700"/><rect x="16" y="16" width="4" height="4" fill="#FFD700"/><rect x="20" y="16" width="4" height="4" fill="#FFD700"/><rect x="24" y="16" width="4" height="4" fill="#FFD700"/><rect x="28" y="16" width="4" height="4" fill="#FFD700"/><rect x="32" y="16" width="4" height="4" fill="#FFD700"/><rect x="8" y="20" width="4" height="4" fill="#FFD700"/><rect x="12" y="20" width="4" height="4" fill="#FFD700"/><rect x="16" y="20" width="4" height="4" fill="#FFD700"/><rect x="20" y="20" width="4" height="4" fill="#FFD700"/><rect x="24" y="20" width="4" height="4" fill="#FFD700"/><rect x="12" y="24" width="4" height="4" fill="#FFD700"/><rect x="16" y="24" width="4" height="4" fill="#FFD700"/><rect x="20" y="24" width="4" height="4" fill="#FFD700"/><rect x="16" y="28" width="4" height="4" fill="#FFD700"/><rect x="16" y="32" width="4" height="4" fill="#FFD700"/></g></g><text x="88" y="50" class="pixel blink-cursor" font-size="17">▶</text>
  <text x="110" y="50" class="pixel yellow" font-size="17" letter-spacing="1">* [NEMIKA] USED DETERMINATION.</text>
  <line x1="30" y1="64" x2="820" y2="64" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <text x="88" y="90" class="pixel  row" font-size="14" fill="#ffffff" style="animation-delay:0.3s">* It's super effective.</text>
  
</svg>
