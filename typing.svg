<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 76" width="100%" height="76" role="img" aria-label="Nemika is an AI / ML Engineer">
  <defs>
    <filter id="heartglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pixel { font-family: 'Courier New', 'Lucida Console', monospace; }
    .yellow { fill:#FFD700; font-weight:bold; }
    .val { fill:#FFD700; }
    .dim { fill:#ffffff; opacity:.6; }
    .menu-text { font-family:'Courier New','Lucida Console',monospace; font-size:15px; font-weight:bold; fill:#fff; }
    .blink-cursor { animation: blink 1.1s step-end infinite; fill:#FFD700; }
    .heart-pulse { transform-box: fill-box; transform-origin: center; animation: heartbeat 1.4s ease-in-out infinite; }
    .bob { animation: bob 1.2s steps(1) infinite; }
    .hp-bar-anim { animation: hpglow 2.5s ease-in-out infinite alternate; }
    .tw { animation: twinkle 2.4s ease-in-out infinite alternate; }
    .row { animation: fadein .6s ease-out both; }
    @keyframes blink { 0%,100% {opacity:1;} 50% {opacity:0;} }
    @keyframes heartbeat { 0%,100% {transform:scale(1);} 30% {transform:scale(1.18);} 60% {transform:scale(.92);} }
    @keyframes bob { 0%,100% {transform:translateY(0);} 50% {transform:translateY(-3px);} }
    @keyframes hpglow { 0% {opacity:.85;} 100% {opacity:1;} }
    @keyframes twinkle { 0% {opacity:.15;} 100% {opacity:1;} }
    @keyframes fadein { from {opacity:0;} to {opacity:1;} }
  </style>
  <defs><clipPath id="t0"><rect x="252.2" y="30" height="30" width="0"><animate attributeName="width" values="0.0;345.6;345.6;0.0;0.0" keyTimes="0;0.1125;0.246;0.25;1" dur="16.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="t1"><rect x="214.4" y="30" height="30" width="0"><animate attributeName="width" values="0.0;0.0;421.2;421.2;0.0;0.0" keyTimes="0;0.25;0.3625;0.496;0.5;1" dur="16.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="t2"><rect x="241.4" y="30" height="30" width="0"><animate attributeName="width" values="0.0;0.0;367.2;367.2;0.0;0.0" keyTimes="0;0.5;0.6125;0.746;0.75;1" dur="16.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="t3"><rect x="182.0" y="30" height="30" width="0"><animate attributeName="width" values="0.0;0.0;486.0;486.0;0.0;0.0" keyTimes="0;0.75;0.8625;0.996;1.0;1" dur="16.0s" repeatCount="indefinite"/></rect></clipPath></defs>
  <rect width="850" height="76" fill="#000000"/>
  <rect x="6" y="6" width="838" height="64" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="12" y="12" width="826" height="52" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="6" y="6" width="8" height="8" fill="#000000"/><rect x="836" y="6" width="8" height="8" fill="#000000"/>
  <rect x="6" y="62" width="8" height="8" fill="#000000"/><rect x="836" y="62" width="8" height="8" fill="#000000"/>
  <text x="46" y="50" class="pixel tw" font-size="14" fill="#FFD700">✦</text><text x="790" y="50" class="pixel tw" font-size="14" fill="#FFD700" style="animation-delay:1.2s">✦</text><text x="252.2" y="52" class="pixel yellow" font-size="18" clip-path="url(#t0)">* Nemika is an AI / ML Engineer.</text>
  <text x="214.4" y="52" class="pixel yellow" font-size="18" clip-path="url(#t1)">* They study the patterns of the world.</text>
  <text x="241.4" y="52" class="pixel yellow" font-size="18" clip-path="url(#t2)">* DETERMINATION stat is maxed out.</text>
  <text x="182.0" y="52" class="pixel yellow" font-size="18" clip-path="url(#t3)">* It's a beautiful day to train a neural net.</text>
  
</svg>
