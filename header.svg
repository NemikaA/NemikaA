<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Wave Gradient 1 -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Wave Gradient 2 -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Ambient Light Filter -->
    <filter id="ambient" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .tag {
      font-family: "SF Mono", Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #a5b4fc;
    }
    .wave1 {
      animation: waveMotion1 8s ease-in-out infinite alternate;
    }
    .wave2 {
      animation: waveMotion2 10s ease-in-out infinite alternate;
    }
    @keyframes waveMotion1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(6px); }
    }
    @keyframes waveMotion2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Container Box with Rounded Corners & Border -->
  <rect width="850" height="200" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="40" r="60" fill="#6366f1" opacity="0.25" filter="url(#ambient)" />
  <circle cx="720" cy="160" r="70" fill="#06b6d4" opacity="0.2" filter="url(#ambient)" />

  <!-- Flowing Bottom Waves -->
  <g class="wave2">
    <path d="M0,140 C180,110 320,180 500,135 C680,90 760,150 850,130 L850,200 L0,200 Z" fill="url(#waveGrad2)" />
  </g>
  <g class="wave1">
    <path d="M0,155 C160,130 340,195 520,150 C680,115 780,165 850,145 L850,200 L0,200 Z" fill="url(#waveGrad1)" />
  </g>

  <!-- Content Group -->
  <g transform="translate(425, 0)" text-anchor="middle">
    <!-- Status / Role Pill -->
    <rect x="-140" y="24" width="280" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" opacity="0.9" />
    <circle cx="-120" cy="37" r="4" fill="#10b981" />
    <text x="5" y="42" class="tag">SOFTWARE DEVELOPER &amp; BUILDER</text>

    <!-- Main Title -->
    <text x="0" y="94" class="title" filter="url(#glow)">Nemika Aluthgedara</text>

    <!-- Subtitle -->
    <text x="0" y="124" class="subtitle">Applied AI  •  Full-Stack &amp; Systems  •  Sri Lanka 🇱🇰</text>
  </g>
</svg>
