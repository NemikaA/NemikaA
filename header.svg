<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="heartglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .pixel {
      font-family: 'Courier New', 'Lucida Console', monospace;
      fill: #ffffff;
    }
    .yellow {
      fill: #FFD700;
    }
    .red {
      fill: #FF0000;
    }
    .hp-fill {
      fill: #FFD700;
    }
    .menu-text {
      font-family: 'Courier New', 'Lucida Console', monospace;
      font-size: 15px;
      font-weight: bold;
      fill: #ffffff;
    }
    .blink-cursor {
      animation: blink 1.1s step-end infinite;
      fill: #FFD700;
    }
    .heart-pulse {
      animation: heartbeat 1.4s ease-in-out infinite;
    }
    .hp-bar-anim {
      animation: hpglow 2.5s ease-in-out infinite alternate;
    }
    .stars {
      animation: twinkle 2s ease-in-out infinite alternate;
    }
    .stars2 {
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.18); }
      60% { transform: scale(0.92); }
    }
    @keyframes hpglow {
      0% { opacity: 0.85; }
      100% { opacity: 1; filter: url(#glow); }
    }
    @keyframes twinkle {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Pure black background -->
  <rect width="850" height="240" fill="#000000"/>

  <!-- Outer white pixel border -->
  <rect x="6" y="6" width="838" height="228" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- Inner double border -->
  <rect x="12" y="12" width="826" height="216" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Decorative corner pixels (Undertale UI style) -->
  <rect x="6" y="6" width="8" height="8" fill="#000000"/>
  <rect x="836" y="6" width="8" height="8" fill="#000000"/>
  <rect x="6" y="226" width="8" height="8" fill="#000000"/>
  <rect x="836" y="226" width="8" height="8" fill="#000000"/>

  <!-- Twinkling stars background -->
  <text x="30" y="45" class="pixel stars" font-size="10" fill="#ffffff" opacity="0.6">✦</text>
  <text x="790" y="55" class="pixel stars2" font-size="8" fill="#ffffff" opacity="0.5">✦</text>
  <text x="55" y="195" class="pixel stars2" font-size="7" fill="#ffffff" opacity="0.4">✦</text>
  <text x="800" y="190" class="pixel stars" font-size="9" fill="#ffffff" opacity="0.5">✦</text>
  <text x="750" y="35" class="pixel stars" font-size="6" fill="#ffffff" opacity="0.3">✦</text>
  <text x="100" y="220" class="pixel stars2" font-size="6" fill="#ffffff" opacity="0.3">✦</text>

  <!-- SOUL Heart (animated) - left side -->
  <g transform="translate(52, 108)" class="heart-pulse" filter="url(#heartglow)">
    <text font-family="'Courier New', monospace" font-size="30" fill="#FF0000" text-anchor="middle">♥</text>
  </g>

  <!-- Main dialogue area - name & title -->
  <!-- Blinking cursor before name -->
  <text x="88" y="72" class="pixel blink-cursor" font-size="17">▶</text>

  <!-- Name line -->
  <text x="110" y="72" class="pixel yellow" font-size="17" font-weight="bold" letter-spacing="1">Nemika Aluthgedara</text>

  <!-- Dialogue lines (Undertale asterisk style) -->
  <text x="88" y="100" class="pixel" font-size="14" fill="#ffffff">* Aspiring AI / ML Engineer &amp; Data Scientist.</text>
  <text x="88" y="122" class="pixel" font-size="14" fill="#ffffff">* From the land of Sri Lanka  🇱🇰.</text>
  <text x="88" y="144" class="pixel" font-size="14" fill="#ffffff">* Builds models that see, understand, and learn.</text>

  <!-- Divider line -->
  <line x1="30" y1="158" x2="820" y2="158" stroke="#ffffff" stroke-width="1" opacity="0.4"/>

  <!-- HP / LV / Stats Row -->
  <text x="88" y="176" class="pixel" font-size="13" fill="#ffffff">HP</text>

  <!-- HP bar background -->
  <rect x="112" y="163" width="140" height="14" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
  <!-- HP bar fill (animated glow) -->
  <rect x="113" y="164" width="130" height="12" class="hp-fill hp-bar-anim" rx="1"/>

  <text x="260" y="176" class="pixel yellow" font-size="13">92 / 100</text>

  <text x="390" y="176" class="pixel" font-size="13" fill="#ffffff">LV  <tspan fill="#FFD700">20</tspan>   EXP <tspan fill="#FFD700">: ∞</tspan></text>
  <text x="560" y="176" class="pixel" font-size="13" fill="#ffffff">AT <tspan fill="#FFD700">99</tspan>  DF <tspan fill="#FFD700">99</tspan></text>

  <!-- Battle Menu Boxes (FIGHT / ACT / ITEM / MERCY) -->
  <!-- FIGHT -->
  <rect x="88" y="192" width="120" height="34" fill="#000000" stroke="#ffffff" stroke-width="2.5"/>
  <text x="148" y="214" class="menu-text" text-anchor="middle">FIGHT</text>

  <!-- ACT -->
  <rect x="220" y="192" width="120" height="34" fill="#000000" stroke="#ffffff" stroke-width="2.5"/>
  <text x="280" y="214" class="menu-text" text-anchor="middle">ACT</text>

  <!-- ITEM -->
  <rect x="352" y="192" width="120" height="34" fill="#000000" stroke="#ffffff" stroke-width="2.5"/>
  <text x="412" y="214" class="menu-text" text-anchor="middle">ITEM</text>

  <!-- MERCY (highlighted yellow) -->
  <rect x="484" y="192" width="120" height="34" fill="#000000" stroke="#FFD700" stroke-width="2.5"/>
  <text x="544" y="214" class="menu-text" text-anchor="middle" fill="#FFD700">MERCY</text>

  <!-- DETERMINATION label (right side, faint) -->
  <text x="820" y="214" class="pixel" font-size="11" fill="#FFD700" opacity="0.7" text-anchor="end" letter-spacing="2">DETERMINATION</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
