<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 70" width="100%" height="70" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .pixel {
      font-family: 'Courier New', 'Lucida Console', monospace;
    }
    .footer-text {
      animation: fadeloop 4s ease-in-out infinite alternate;
    }
    .heart-beat {
      animation: hbeat 1.4s ease-in-out infinite;
    }
    @keyframes fadeloop {
      0% { opacity: 0.65; }
      100% { opacity: 1; }
    }
    @keyframes hbeat {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.2); }
    }
  </style>

  <!-- Black background -->
  <rect width="850" height="70" fill="#000000"/>

  <!-- White border -->
  <rect x="4" y="4" width="842" height="62" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="8" y="8" width="834" height="54" fill="none" stroke="#ffffff" stroke-width="1"/>

  <!-- Corner pixel-art dots -->
  <rect x="4" y="4" width="6" height="6" fill="#000000"/>
  <rect x="840" y="4" width="6" height="6" fill="#000000"/>
  <rect x="4" y="60" width="6" height="6" fill="#000000"/>
  <rect x="840" y="60" width="6" height="6" fill="#000000"/>

  <!-- Heart icon (animated) -->
  <text x="88" y="44" class="pixel heart-beat" font-size="22" fill="#FF0000" text-anchor="middle">♥</text>

  <!-- Footer message -->
  <text x="425" y="44" class="pixel footer-text" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">* you are filled with  <tspan fill="#FFD700" font-weight="bold">determination.</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
