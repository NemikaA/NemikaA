<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="100%" height="330" role="img" aria-label="Special attacks: featured projects" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .pixel { font-family: 'Courier New', 'Lucida Console', monospace; }
    .w { fill:#ffffff; } .y { fill:#FFD700; font-weight:bold; } .r { fill:#FF0000; } .dim { fill:#b8b8b8; }
    .row { animation: fadein .6s ease-out both; }
    .blink { animation: blink 1.1s step-end infinite; fill:#FFD700; }
    .pulse { animation: hpglow 2.5s ease-in-out infinite alternate; }
    .stars { animation: twinkle 2s ease-in-out infinite alternate; }
    .sel { animation: pick 6s step-end infinite; }
    @keyframes fadein { from { opacity:0; transform:translateX(-8px);} to { opacity:1; transform:none; } }
    @keyframes blink { 0%,100% {opacity:1;} 50% {opacity:0;} }
    @keyframes hpglow { 0% {opacity:.8;} 100% {opacity:1;} }
    @keyframes twinkle { 0% {opacity:.25;} 100% {opacity:1;} }
    @keyframes pick { 0% {opacity:1;} 33.3% {opacity:.12;} 100% {opacity:.12;} }
      .bob { animation: bob 1.2s steps(1) infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  </style>
